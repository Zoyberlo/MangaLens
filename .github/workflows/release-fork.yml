name: Release MangaLens

# Publishes the GitHub release that the in-app updater reads. Upstream's
# release.yml is disabled outside mihonapp/mihon, so this fork has its own.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v1.0.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # getLatestCommitCount() walks the history
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # -Penable-updater switches on the in-app update checker, which reads the
      # releases this workflow publishes. -Psplit-abis makes one APK per ABI
      # plus a universal one, so a phone downloads ~65 MB instead of ~94 MB.
      - name: Build signed release APKs
        run: ./gradlew assembleRelease -Penable-updater -Psplit-abis --build-cache
        env:
          MIHON_GITHUB_RELEASE: "true"
          storeFileBase64: ${{ secrets.STORE_FILE_BASE64 }}
          storePassword: ${{ secrets.STORE_PASSWORD }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # The updater matches an asset by "-<abi>" in its file name and falls back
      # to the one with no ABI marker it recognises, which is the universal
      # build. Renaming it to end in "-universal" keeps that fallback: the
      # updater's ABI list has no "universal" entry, so it stays the null key.
      - name: Name the APKs after the release
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cd app/build/outputs/apk/release
          if [ -f "app-release.apk" ]; then
            mv "app-release.apk" "mangalens-$TAG.apk"
          fi
          for abi in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            if [ -f "app-$abi-release.apk" ]; then
              mv "app-$abi-release.apk" "mangalens-$TAG-$abi.apk"
            fi
          done
          ls -la
          # A missing split would silently publish a release that half the
          # phones cannot update to, so fail here instead
          for expected in "-arm64-v8a" "-armeabi-v7a" "-universal"; do
            test -f "mangalens-$TAG$expected.apk" \
              || { echo "::error::missing mangalens-$TAG$expected.apk"; exit 1; }
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            app/build/outputs/apk/release/mangalens-*.apk \
            --title "MangaLens $TAG" \
            --generate-notes
