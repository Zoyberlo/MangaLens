name: Build MangaLens

on:
  push:
    branches: [feature/auto-translate]
    # A tagged commit is built by release-fork.yml; running both makes them
    # fight over the runner and doubles the wait
    tags-ignore: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Same file upstream's CI reads: Mihon 0.21's build plugins need 21
          java-version-file: .github/.java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Reuse task outputs (R8, Compose compilation) across runs
          cache-read-only: false

      # Mihon 0.21's build reads the keystore from a file path (storeFile), not
      # from base64 as before; without this the build stops at configuration
      - name: Decode signing keystore
        run: echo "$STORE_FILE_BASE64" | base64 -d > "${{ runner.temp }}/mangalens.jks"
        env:
          STORE_FILE_BASE64: ${{ secrets.STORE_FILE_BASE64 }}

      - name: Build signed release APKs
        run: ./gradlew assembleRelease --build-cache
        env:
          MIHON_GITHUB_RELEASE: "true"
          storeFile: ${{ runner.temp }}/mangalens.jks
          storePassword: ${{ secrets.STORE_PASSWORD }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mangalens-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
